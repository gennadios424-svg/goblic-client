name: Build Goblic Client

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: unzip -q goblic-client.zip

      - name: Build Fabric mod
        working-directory: goblic-client
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: goblic-client-jar
          path: |
            goblic-client/build/libs/*.jar
            !goblic-client/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
